<style include="settings-shared md-select">
  .proxy-field {
    padding: 12px var(--cr-section-padding);
  }

  .proxy-grid {
    box-sizing: border-box;
    display: grid;
    gap: 12px 16px;
    grid-template-columns: minmax(0, 1fr) 120px;
    width: 100%;
  }

  .full-width {
    grid-column: 1 / -1;
  }

  .status-row {
    align-items: flex-start;
    color: var(--google-grey-700);
    min-height: auto;
    padding-bottom: 12px;
    padding-top: 12px;
  }

  .warning-row {
    color: var(--cr-fallback-color-warning);
  }

  .error-row {
    color: var(--cr-fallback-color-error);
  }

  .status-title {
    font-weight: 500;
  }

  .result-panel {
    border: 1px solid var(--cr-separator-color);
    border-radius: 8px;
    margin: 12px var(--cr-section-padding);
    overflow: hidden;
  }

  .result-header {
    align-items: center;
    display: flex;
    gap: 12px;
    padding: 16px;
  }

  .flag {
    align-items: center;
    background-image: url('fingerprint-proxy-flags.png');
    background-repeat: no-repeat;
    display: flex;
    font-size: 14px;
    height: 48px;
    justify-content: center;
    min-width: 64px;
    width: 64px;
  }

  .result-grid {
    border-top: 1px solid var(--cr-separator-color);
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .result-item {
    min-width: 0;
    padding: 12px 16px;
  }

  .result-label {
    color: var(--cr-secondary-text-color);
    font-size: 12px;
  }

  .result-value {
    overflow-wrap: anywhere;
    padding-top: 4px;
  }

  .actions-row {
    gap: 8px;
    justify-content: flex-end;
  }

  #scheme {
    width: 160px;
  }

  @media (prefers-color-scheme: dark) {
    .status-row {
      color: var(--google-grey-300);
    }

    .warning-row {
      color: var(--google-yellow-300);
    }
  }

  @media (max-width: 600px) {
    .proxy-grid,
    .result-grid {
      grid-template-columns: minmax(0, 1fr);
    }
  }
</style>

<settings-section page-title="$i18n{profileProxyTitle}">
  <div class="cr-row">
    <div class="flex cr-padded-text">
      <a href="brave://fingerprint-guide/">使用指南</a>
    </div>
  </div>
  <template is="dom-if" if="[[!enabled_]]">
    <div id="noProxyRisk" class="cr-row status-row warning-row" role="alert">
      <div>
        <div class="status-title">$i18n{profileProxyNoProxyRiskTitle}</div>
        <div>$i18n{profileProxyNoProxyRiskDesc}</div>
      </div>
    </div>
  </template>

  <template is="dom-if" if="[[isActive_(state_, activeGeo_)]]">
    <div class="result-panel" id="activeProxy">
      <div class="result-header">
        <div class="flag"
            style$="[[countryFlagStyle_(activeGeo_.countryCode)]]">
          [[countryFlagFallback_(activeGeo_.countryCode)]]
        </div>
        <div>
          <div class="status-title">[[statusMessage_]]</div>
          <div class="secondary">[[egressIp_]]</div>
        </div>
      </div>
      <template is="dom-if" if="[[activeGeo_]]">
        <div class="result-grid">
          <div class="result-item">
            <div class="result-label">$i18n{profileProxyLocation}</div>
            <div class="result-value">
              [[activeGeo_.countryName]], [[activeGeo_.cityName]]
            </div>
          </div>
          <div class="result-item">
            <div class="result-label">$i18n{profileProxyTimezone}</div>
            <div class="result-value">[[activeGeo_.timezone]]</div>
          </div>
          <div class="result-item">
            <div class="result-label">$i18n{profileProxyLanguage}</div>
            <div class="result-value">[[activeGeo_.acceptLanguages]]</div>
          </div>
          <div class="result-item">
            <div class="result-label">$i18n{profileProxyLastVerified}</div>
            <div class="result-value">
              [[formatLastVerified_(lastVerified_)]]
            </div>
          </div>
        </div>
      </template>
      <div class="cr-row actions-row">
        <cr-button on-click="onDisable_"
            disabled="[[isInteractionDisabled_(isBusy_, state_)]]">
          $i18n{profileProxyDisable}
        </cr-button>
        <cr-button class="action-button" on-click="onRevalidate_"
            disabled="[[isInteractionDisabled_(isBusy_, state_)]]">
          $i18n{profileProxyRevalidate}
        </cr-button>
      </div>
    </div>
  </template>

  <template is="dom-if" if="[[showWarningState_(state_)]]">
    <div class$="cr-row status-row [[warningStateClass_(state_)]]"
        role="alert">
      <div>
        <div class="status-title">[[statusMessage_]]</div>
      </div>
    </div>
  </template>

  <template is="dom-if" if="[[showRecoveryActions_(enabled_, state_)]]">
    <div class="cr-row actions-row">
      <cr-button on-click="onDisable_"
          disabled="[[isInteractionDisabled_(isBusy_, state_)]]">
        $i18n{profileProxyDisable}
      </cr-button>
      <cr-button class="action-button" on-click="onRevalidate_"
          disabled="[[isInteractionDisabled_(isBusy_, state_)]]">
        $i18n{profileProxyRevalidate}
      </cr-button>
    </div>
  </template>

  <template is="dom-if" if="[[isNonEmpty_(changeWarning_)]]">
    <div class="cr-row status-row warning-row" role="alert">
      <div>[[changeWarning_]]</div>
    </div>
  </template>

  <div class="cr-row">
    <div class="flex">
      <div class="label">$i18n{profileProxySchemeLabel}</div>
      <div class="secondary">$i18n{profileProxySchemeDesc}</div>
    </div>
    <select id="scheme" class="md-select" on-change="onSchemeChanged_"
        disabled="[[isInteractionDisabled_(isBusy_, state_)]]">
      <option value="http" selected="[[schemeEqual_('http', scheme_)]]">
        $i18n{profileProxyHttp}
      </option>
      <option value="https" selected="[[schemeEqual_('https', scheme_)]]">
        $i18n{profileProxyHttps}
      </option>
    </select>
  </div>

  <div class="proxy-field">
    <div class="proxy-grid">
      <cr-input id="host"
          label="$i18n{profileProxyHostLabel}"
          value="{{host_::input}}"
          spellcheck="false"
          invalid="[[isNonEmpty_(hostError_)]]"
          error-message="[[hostError_]]"
          disabled="[[isInteractionDisabled_(isBusy_, state_)]]"
          on-input="onInputChanged_">
      </cr-input>
      <cr-input id="port"
          label="$i18n{profileProxyPortLabel}"
          value="{{port_::input}}"
          type="number"
          min="1"
          max="65535"
          invalid="[[isNonEmpty_(portError_)]]"
          error-message="[[portError_]]"
          disabled="[[isInteractionDisabled_(isBusy_, state_)]]"
          on-input="onInputChanged_">
      </cr-input>
      <cr-input id="username"
          class="full-width"
          label="$i18n{profileProxyUsernameLabel}"
          value="{{username_::input}}"
          spellcheck="false"
          disabled="[[isInteractionDisabled_(isBusy_, state_)]]"
          on-input="onInputChanged_">
      </cr-input>
      <cr-input id="password"
          class="full-width"
          label="$i18n{profileProxyPasswordLabel}"
          value="{{password_::input}}"
          type="password"
          placeholder="[[passwordHint_(hasSavedPassword_)]]"
          disabled="[[isInteractionDisabled_(isBusy_, state_)]]"
          on-input="onInputChanged_">
      </cr-input>
    </div>
  </div>

  <template is="dom-if" if="[[isNonEmpty_(actionError_)]]">
    <div id="actionError" class="cr-row status-row error-row" role="alert">
      <div>[[actionError_]]</div>
    </div>
  </template>

  <template is="dom-if" if="[[verification_]]">
    <div class="result-panel" id="verificationResult">
      <div class="result-header">
        <div class="flag"
            style$="[[countryFlagStyle_(verification_.geo.countryCode)]]">
          [[countryFlagFallback_(verification_.geo.countryCode)]]
        </div>
        <div>
          <div class="status-title">
            [[verification_.geo.countryName]],
            [[verification_.geo.cityName]]
          </div>
          <div class="secondary">[[verification_.egressIp]]</div>
        </div>
      </div>
      <div class="result-grid">
        <div class="result-item">
          <div class="result-label">$i18n{profileProxyTimezone}</div>
          <div class="result-value">[[verification_.geo.timezone]]</div>
        </div>
        <div class="result-item">
          <div class="result-label">$i18n{profileProxyCoordinates}</div>
          <div class="result-value">
            [[formatCoordinates_(verification_.geo)]]
          </div>
        </div>
        <div class="result-item">
          <div class="result-label">$i18n{profileProxyLanguage}</div>
          <div class="result-value">
            [[verification_.geo.acceptLanguages]]
          </div>
        </div>
        <div class="result-item">
          <div class="result-label">$i18n{profileProxyWebRtc}</div>
          <div class="result-value">$i18n{profileProxyWebRtcProxyOnly}</div>
        </div>
      </div>
      <div class="cr-row actions-row">
        <cr-button on-click="onInputChanged_"
            disabled="[[isInteractionDisabled_(isBusy_, state_)]]">
          $i18n{profileProxyModify}
        </cr-button>
        <cr-button class="action-button" on-click="onApply_"
            disabled="[[isInteractionDisabled_(isBusy_, state_)]]">
          $i18n{profileProxyConfirmApply}
        </cr-button>
      </div>
    </div>
  </template>

  <template is="dom-if" if="[[!verification_]]">
    <div class="cr-row actions-row">
      <cr-button id="verify" class="action-button" on-click="onVerify_"
          disabled="[[isInteractionDisabled_(isBusy_, state_)]]">
        $i18n{profileProxyVerify}
      </cr-button>
    </div>
  </template>
</settings-section>
